spring.application.name=food-ordering-platform

# Without an explicit profile the "local" profile is used, which loads the MySQL credentials from
# application-local.properties. That file is git-ignored; copy application-local.example.properties to create it.
spring.profiles.default=local

spring.datasource.url=jdbc:mysql://localhost:3306/food-ordering-platform
spring.jpa.open-in-view=false

# Mailpit catches every email locally (SMTP on port 1025, web inbox on http://localhost:8025).
spring.mail.host=localhost
spring.mail.port=1025